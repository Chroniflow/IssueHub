services:
  backend:
    build:
      context: ./Backend
    ports:
      - "8080:8080"
    stdin_open: true
    tty: true
    environment:
      DB_URL: jdbc:mysql://mysql:3306/simp_issue_hub?serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: simp_issue_hub
      DB_PASSWORD: simp_issue_hub
      TUI_ENABLED: "true"
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      SMTP_SSL: "false"
      MAIL_FROM: no-reply@localhost
      EMAIL_VERIFICATION_REQUIRED: "true"
      SITE_ICON_URL: ${SITE_ICON_URL:-}
      ATTACHMENT_STORAGE_DIRECTORY: /app/data/attachments
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-10485760}
      ATTACHMENT_MAX_REQUEST_BYTES: ${ATTACHMENT_MAX_REQUEST_BYTES:-11534336}
      ATTACHMENT_ALLOWED_EXTENSIONS: ${ATTACHMENT_ALLOWED_EXTENSIONS:-png,jpg,jpeg,gif,webp,mp4,webm,zip,pdf,txt,log}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_EXPECTED_HOSTNAME: ${TURNSTILE_EXPECTED_HOSTNAME:-}
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: simp_issue_hub
      MYSQL_USER: simp_issue_hub
      MYSQL_PASSWORD: simp_issue_hub
      MYSQL_ROOT_PASSWORD: local_root_only
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u simp_issue_hub -psimp_issue_hub --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

volumes:
  mysql-data:
  backend-data:
