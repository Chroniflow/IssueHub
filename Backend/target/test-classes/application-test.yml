spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/simpissuehub?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: 127.0.0.1
    port: 1
app:
  security:
    registration-verification:
      required: false
  tui:
    enabled: false
  mail:
    imap:
      poll-interval: 3600000
sa-token:
  is-concurrent: false
